name: Temporary Prepare Collector Release

on:
  push:
    branches:
      - chore/release-0.1.1

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout release preparation branch
        uses: actions/checkout@v7
        with:
          ref: chore/release-0.1.1
          fetch-depth: 0

      - name: Install Rust
        shell: bash
        run: rustup toolchain install 1.98.0 --profile minimal

      - name: Bump package and lockfile version
        shell: bash
        run: |
          set -euo pipefail

          sed -i '0,/version = "0.1.0"/s//version = "0.1.1"/' Cargo.toml
          cargo +1.98.0 metadata --format-version 1 >/dev/null

          manifest_version="$(sed -n 's/^version = "\([^"]*\)"$/\1/p' Cargo.toml | head -n 1)"
          lock_version="$(awk '
            $0 == "name = \"mnemos-collector\"" { found = 1; next }
            found && /^version = / { gsub(/version = \"|\"/, ""); print; exit }
          ' Cargo.lock)"

          if [ "$manifest_version" != "0.1.1" ] || [ "$lock_version" != "0.1.1" ]; then
            echo "Collector version bump did not update Cargo.toml and Cargo.lock consistently."
            exit 1
          fi

          lock_changes="$(git diff --unified=0 -- Cargo.lock | grep -E '^[+-][^+-]' || true)"
          expected_changes=$'-version = "0.1.0"\n+version = "0.1.1"'

          if [ "$lock_changes" != "$expected_changes" ]; then
            echo "Cargo.lock changed beyond the root package version:"
            printf '%s\n' "$lock_changes"
            exit 1
          fi

      - name: Commit prepared release version
        shell: bash
        run: |
          set -euo pipefail

          rm .github/workflows/temp-prepare-release.yml

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.toml Cargo.lock .github/workflows/temp-prepare-release.yml
          git commit -m "Prepare Collector 0.1.1"
          git push origin HEAD:chore/release-0.1.1
