name: Temporary Prepare Collector 0.1.2

on:
  push:
    branches:
      - chore/release-0.1.2

permissions:
  contents: write

jobs:
  prepare:
    if: github.event.head_commit.message == 'Add temporary Collector 0.1.2 preparation workflow'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout release branch
        uses: actions/checkout@v7
        with:
          ref: chore/release-0.1.2
          fetch-depth: 0

      - name: Bump Collector version
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path

          manifest = Path("Cargo.toml")
          manifest_text = manifest.read_text()
          old_manifest = 'version = "0.1.1"'
          new_manifest = 'version = "0.1.2"'

          if manifest_text.count(old_manifest) != 1:
              raise SystemExit("Cargo.toml does not contain exactly one 0.1.1 package version")

          manifest.write_text(manifest_text.replace(old_manifest, new_manifest, 1))

          lock = Path("Cargo.lock")
          lock_text = lock.read_text()
          old_lock = '[[package]]\nname = "mnemos-collector"\nversion = "0.1.1"\n'
          new_lock = '[[package]]\nname = "mnemos-collector"\nversion = "0.1.2"\n'

          if lock_text.count(old_lock) != 1:
              raise SystemExit("Cargo.lock does not contain exactly one mnemos-collector 0.1.1 package entry")

          lock.write_text(lock_text.replace(old_lock, new_lock, 1))
          PY

          rm .github/workflows/temp-prepare-release-0.1.2.yml

      - name: Verify release diff
        shell: bash
        run: |
          set -euo pipefail

          test "$(sed -n 's/^version = "\([^"]*\)"$/\1/p' Cargo.toml | head -n 1)" = "0.1.2"
          grep -A2 'name = "mnemos-collector"' Cargo.lock | grep -q 'version = "0.1.2"'

          changed="$(git diff --name-only | sort)"
          expected="$(printf '%s\n' '.github/workflows/temp-prepare-release-0.1.2.yml' 'Cargo.lock' 'Cargo.toml' | sort)"

          if [ "$changed" != "$expected" ]; then
            echo "Unexpected files changed:" >&2
            git diff --name-only >&2
            exit 1
          fi

      - name: Commit release preparation
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.toml Cargo.lock .github/workflows/temp-prepare-release-0.1.2.yml
          git commit -m "Prepare Collector 0.1.2"
          git push origin HEAD:chore/release-0.1.2
