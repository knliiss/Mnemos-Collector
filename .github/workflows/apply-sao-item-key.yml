name: Apply SAO item key

on:
  push:
    branches:
      - feat/sao-localization
    paths:
      - .github/workflows/apply-sao-item-key.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/sao-localization
          fetch-depth: 0

      - name: Apply canonical item key propagation
        shell: python
        run: |
          from pathlib import Path

          protocol_path = Path("src/protocol.rs")
          protocol = protocol_path.read_text()
          protocol = protocol.replace(
              '    ItemDrop {\n        #[serde(rename = "itemName")]\n        item_name: String,',
              '    ItemDrop {\n        #[serde(rename = "itemKey", skip_serializing_if = "Option::is_none")]\n        item_key: Option<String>,\n        #[serde(rename = "itemName")]\n        item_name: String,',
              1,
          )
          protocol_path.write_text(protocol)

          catalog_path = Path("src/localization/catalog.rs")
          catalog = catalog_path.read_text()
          catalog = catalog.replace(
              'pub struct LocalizedItemDrop {\n    pub player_prefix: String,\n    pub item_name: String,',
              'pub struct LocalizedItemDrop {\n    pub player_prefix: String,\n    pub item_key: Option<String>,\n    pub item_name: String,',
              1,
          )
          catalog = catalog.replace(
              '            return Some(LocalizedItemDrop {\n                player_prefix: player_prefix.trim().to_owned(),\n                item_name,',
              '            return Some(LocalizedItemDrop {\n                player_prefix: player_prefix.trim().to_owned(),\n                item_key,\n                item_name,',
              1,
          )
          catalog_path.write_text(catalog)

          parser_path = Path("src/parser/mod.rs")
          parser = parser_path.read_text()
          parser = parser.replace(
              '    Some(CollectorEvent::ItemDrop {\n        item_name: drop.item_name,',
              '    Some(CollectorEvent::ItemDrop {\n        item_key: drop.item_key,\n        item_name: drop.item_name,',
              1,
          )
          parser_path.write_text(parser)

          for path in Path("tests").glob("*.rs"):
              text = path.read_text()
              text = text.replace(
                  'CollectorEvent::ItemDrop {\n            item_name:',
                  'CollectorEvent::ItemDrop {\n            item_key: None,\n            item_name:',
              )
              path.write_text(text)

          localization_test_path = Path("tests/localization_parser.rs")
          localization_test = localization_test_path.read_text()
          localization_test = localization_test.replace(
              '                dropped_for,\n            },',
              '                dropped_for,\n                ..\n            },',
              1,
          )
          localization_test_path.write_text(localization_test)

      - name: Install Rust formatter
        run: rustup toolchain install 1.98.0 --profile minimal --component rustfmt

      - name: Format Rust sources
        run: cargo +1.98.0 fmt --all

      - name: Commit changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src tests

          if git diff --cached --quiet; then
            echo "No changes required."
            exit 0
          fi

          git commit -m "Send canonical SAO item keys"
          git push origin HEAD:feat/sao-localization
