name: Reliability Format Sync

on:
  push:
    branches:
      - feat/collector-reliability-diagnostics
    paths:
      - "src/**/*.rs"
      - "tests/**/*.rs"
      - ".github/workflows/reliability-fmt-sync.yml"

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout branch
        uses: actions/checkout@v7
        with:
          ref: feat/collector-reliability-diagnostics
          fetch-depth: 0

      - name: Install Rust formatter
        run: rustup toolchain install 1.98.0 --profile minimal --component rustfmt

      - name: Format Rust sources
        run: cargo +1.98.0 fmt --all

      - name: Validate formatting-only changes
        shell: bash
        run: |
          set -euo pipefail

          changed="$(git diff --name-only)"

          if [ -z "$changed" ]; then
            echo "No formatting changes required."
            exit 0
          fi

          while IFS= read -r path; do
            case "$path" in
              *.rs) ;;
              *)
                echo "Unexpected non-Rust formatting change: $path"
                exit 1
                ;;
            esac
          done <<< "$changed"

      - name: Commit formatting
        shell: bash
        run: |
          set -euo pipefail

          if git diff --quiet; then
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- '*.rs'
          git commit -m "Format reliability changes"
          git push origin HEAD:feat/collector-reliability-diagnostics
