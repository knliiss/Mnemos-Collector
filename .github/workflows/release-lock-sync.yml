name: Release Lock Sync

on:
  push:
    branches:
      - chore/release-0.1.6
    paths:
      - ".github/workflows/release-lock-sync.yml"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout release branch
        uses: actions/checkout@v7
        with:
          ref: chore/release-0.1.6
          fetch-depth: 0

      - name: Install Rust
        run: rustup toolchain install 1.98.0 --profile minimal

      - name: Refresh Cargo.lock
        run: cargo +1.98.0 check

      - name: Validate lock-only update
        shell: bash
        run: |
          set -euo pipefail

          changed="$(git diff --name-only)"

          if [ "$changed" != "Cargo.lock" ]; then
            echo "Expected only Cargo.lock to change, got:"
            printf '%s\n' "$changed"
            exit 1
          fi

          removed="$(git diff -- Cargo.lock | grep -c '^-version = "0.1.5"$' || true)"
          added="$(git diff -- Cargo.lock | grep -c '^+version = "0.1.6"$' || true)"
          changed_lines="$(git diff --numstat -- Cargo.lock | awk '{print $1 + $2}')"

          if [ "$removed" -ne 1 ] || [ "$added" -ne 1 ] || [ "$changed_lines" -ne 2 ]; then
            echo "Unexpected Cargo.lock diff:"
            git diff -- Cargo.lock
            exit 1
          fi

      - name: Commit Cargo.lock
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.lock
          git commit -m "Sync Cargo.lock for 0.1.6"
          git push origin HEAD:chore/release-0.1.6
