name: Temporary Stale Spool Safety

on:
  push:
    branches:
      - fix/macos-credential-recovery-ui-parity

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: fix/macos-credential-recovery-ui-parity

      - name: Patch stale report retention
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path

          application = Path("src/application.rs")
          text = application.read_text(encoding="utf-8")

          constant_needle = "const MAX_REPORTS_PER_TICK: usize = 16;\n"
          constant_replacement = (
              "const MAX_REPORTS_PER_TICK: usize = 16;\n"
              "const MAX_PENDING_REPORT_AGE_SECONDS: i64 = 30 * 60;\n"
          )
          if "MAX_PENDING_REPORT_AGE_SECONDS" not in text:
              if constant_needle not in text:
                  raise SystemExit("application constant insertion point not found")
              text = text.replace(constant_needle, constant_replacement, 1)

          open_needle = """        let spool = ReportSpool::open_default()\n            .await\n            .context(\"failed to open reliable report spool\")?;\n"""
          open_replacement = """        let mut spool = ReportSpool::open_default()\n            .await\n            .context(\"failed to open reliable report spool\")?;\n        discard_expired_reports(&mut spool).await?;\n"""
          if "discard_expired_reports(&mut spool).await?;" not in text:
              if open_needle not in text:
                  raise SystemExit("spool startup insertion point not found")
              text = text.replace(open_needle, open_replacement, 1)

          deliver_needle = """    async fn deliver_pending_reports(&mut self) -> Result<()> {\n        for _ in 0..MAX_REPORTS_PER_TICK {\n"""
          deliver_replacement = """    async fn deliver_pending_reports(&mut self) -> Result<()> {\n        discard_expired_reports(&mut self.spool).await?;\n\n        for _ in 0..MAX_REPORTS_PER_TICK {\n"""
          if "async fn deliver_pending_reports" in text and "discard_expired_reports(&mut self.spool).await?;" not in text:
              if deliver_needle not in text:
                  raise SystemExit("delivery pruning insertion point not found")
              text = text.replace(deliver_needle, deliver_replacement, 1)

          helper_needle = """fn reconnect_delay_after_failure(current: Duration, maximum: Duration) -> Duration {\n"""
          helper = """async fn discard_expired_reports(spool: &mut ReportSpool) -> Result<()> {\n    let cutoff = Utc::now() - chrono::Duration::seconds(MAX_PENDING_REPORT_AGE_SECONDS);\n    let discarded = spool\n        .discard_before(cutoff)\n        .await\n        .context(\"failed to expire stale pending reports\")?;\n\n    if discarded > 0 {\n        diagnostics::warn(\n            \"spool\",\n            format!(\n                \"Discarded {discarded} pending report(s) older than 30 minutes instead of replaying stale events\"\n            ),\n        );\n    }\n\n    Ok(())\n}\n\n"""
          if "async fn discard_expired_reports(spool: &mut ReportSpool)" not in text:
              if helper_needle not in text:
                  raise SystemExit("application helper insertion point not found")
              text = text.replace(helper_needle, helper + helper_needle, 1)

          application.write_text(text, encoding="utf-8")

          spool = Path("src/spool.rs")
          text = spool.read_text(encoding="utf-8")

          method_needle = """    pub async fn acknowledge(&mut self, message_id: Uuid) -> Result<()> {\n"""
          method = """    pub async fn discard_before(&mut self, cutoff: DateTime<Utc>) -> Result<usize> {\n        let previous = self.reports.clone();\n        let previous_len = previous.len();\n\n        self.reports\n            .retain(|report| report.observed_at >= cutoff);\n\n        let discarded = previous_len.saturating_sub(self.reports.len());\n\n        if discarded == 0 {\n            return Ok(0);\n        }\n\n        if let Err(error) = self.persist().await {\n            self.reports = previous;\n            self.publish_state();\n            return Err(error);\n        }\n\n        self.publish_state();\n\n        Ok(discarded)\n    }\n\n"""
          if "pub async fn discard_before" not in text:
              if method_needle not in text:
                  raise SystemExit("spool method insertion point not found")
              text = text.replace(method_needle, method + method_needle, 1)

          helper_needle = """    fn report() -> PendingReport {\n        PendingReport::new(\n            CollectorEvent::Global {\n                event_type: GlobalEventType::Moon,\n            },\n            Utc::now(),\n        )\n    }\n"""
          helper_replacement = """    fn report() -> PendingReport {\n        report_at(Utc::now())\n    }\n\n    fn report_at(observed_at: DateTime<Utc>) -> PendingReport {\n        PendingReport::new(\n            CollectorEvent::Global {\n                event_type: GlobalEventType::Moon,\n            },\n            observed_at,\n        )\n    }\n"""
          if "fn report_at(" not in text:
              if helper_needle not in text:
                  raise SystemExit("spool test helper insertion point not found")
              text = text.replace(helper_needle, helper_replacement, 1)

          test_needle = """    #[tokio::test]\n    async fn refuses_to_silently_drop_reports_when_full() {\n"""
          test = """    #[tokio::test]\n    async fn discards_expired_reports_and_persists_the_remaining_queue() {\n        let directory = std::env::temp_dir().join(format!(\"mnemos-spool-{}\", Uuid::now_v7()));\n        let path = directory.join(\"pending-reports.json\");\n        let mut spool = ReportSpool::open(&path, 8).await.unwrap();\n        let now = Utc::now();\n        let expired = report_at(now - chrono::Duration::hours(2));\n        let retained = report_at(now - chrono::Duration::minutes(5));\n        let retained_id = retained.message_id;\n\n        spool.enqueue(expired).await.unwrap();\n        spool.enqueue(retained).await.unwrap();\n\n        let discarded = spool\n            .discard_before(now - chrono::Duration::minutes(30))\n            .await\n            .unwrap();\n\n        assert_eq!(discarded, 1);\n        assert_eq!(spool.len(), 1);\n        assert_eq!(spool.front().unwrap().message_id, retained_id);\n        drop(spool);\n\n        let reopened = ReportSpool::open(&path, 8).await.unwrap();\n\n        assert_eq!(reopened.len(), 1);\n        assert_eq!(reopened.front().unwrap().message_id, retained_id);\n\n        let _ = fs::remove_dir_all(directory).await;\n    }\n\n"""
          if "discards_expired_reports_and_persists_the_remaining_queue" not in text:
              if test_needle not in text:
                  raise SystemExit("spool test insertion point not found")
              text = text.replace(test_needle, test + test_needle, 1)

          spool.write_text(text, encoding="utf-8")
          PY

          rustup toolchain install 1.98.0 --profile minimal --component rustfmt
          cargo +1.98.0 fmt --all
          git diff --check

      - name: Commit patch when needed
        shell: bash
        run: |
          set -euo pipefail

          if git diff --quiet; then
            echo "Stale spool safety already applied"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/application.rs src/spool.rs
          git commit -m "Expire stale Collector reports before replay"
          git push origin HEAD:fix/macos-credential-recovery-ui-parity
