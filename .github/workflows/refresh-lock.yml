name: Refresh lockfile

on:
  push:
    branches:
      - feat/collector-core

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/collector-core

      - name: Install Rust
        shell: bash
        run: rustup toolchain install 1.98.0 --profile minimal

      - name: Refresh Cargo lockfile
        run: cargo generate-lockfile

      - name: Commit lockfile when changed
        shell: bash
        run: |
          if git diff --quiet -- Cargo.lock; then
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.lock
          git commit -m "Refresh collector dependency lockfile"
          git push origin HEAD:feat/collector-core
