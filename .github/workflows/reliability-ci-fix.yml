name: Reliability CI Fix

on:
  push:
    branches:
      - feat/collector-reliability-diagnostics
    paths:
      - ".github/workflows/reliability-ci-fix.yml"

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout branch
        uses: actions/checkout@v7
        with:
          ref: feat/collector-reliability-diagnostics
          fetch-depth: 0

      - name: Apply exact reliability fixes
        shell: bash
        run: |
          set -euo pipefail

          sed -i 's/line\.as_bytes()\.len()/line.len()/' src/diagnostics.rs

          perl -0pi -e 's/\n            if runtime\.available_update_version\.is_none\(\) \{\n                runtime\.available_update_version = Some\(version\.clone\(\)\);\n            \}\n//s' src/diagnostics.rs

          perl -0pi -e 's/        diagnostics::set_protocol_versions\(COLLECTOR_PROTOCOL_VERSION, None\);\n        diagnostics::set_required_update_version\(None\);/        diagnostics::set_protocol_versions(COLLECTOR_PROTOCOL_VERSION, None);/s' src/realtime/client.rs

          grep -Fq 'let line_bytes = line.len() as u64 + 1;' src/diagnostics.rs
          ! grep -Fq 'runtime.available_update_version = Some(version.clone());' src/diagnostics.rs
          ! grep -A1 -F 'set_protocol_versions(COLLECTOR_PROTOCOL_VERSION, None);' src/realtime/client.rs | grep -Fq 'set_required_update_version(None);'

      - name: Install Rust formatter
        run: rustup toolchain install 1.98.0 --profile minimal --component rustfmt

      - name: Format Rust sources
        run: cargo +1.98.0 fmt --all

      - name: Commit fixes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/diagnostics.rs src/realtime/client.rs
          git commit -m "Address reliability CI findings"
          git push origin HEAD:feat/collector-reliability-diagnostics
